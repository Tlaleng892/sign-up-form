<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Odin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- LEFT SIDE - IMAGE -->
    <div class="left-side">
      <div class="logo-bar">
       <img src="https://raw.githubusercontent.com/TheOdinProject/curriculum/main/html_css/project-sign-up-form/odin-lined.png" alt="Odin Logo">
        <h1>ODIN</h1>
      </div>
      <p class="photo-credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com">Unsplash</a></p>
    </div>

    <!-- RIGHT SIDE - FORM -->
    <div class="right-side">
      <div class="top-text">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up <em>now</em> to get started.</p>
        <p>You <em>know</em> you want to.</p>
      </div>

      <form id="signup-form">
        <div class="form-box">
          <h2>Let's do this!</h2>
          <div class="inputs">
            <div class="field">
              <label for="first-name">FIRST NAME</label>
              <input type="text" id="first-name" name="first-name" required placeholder="Thor">
            </div>
            <div class="field">
              <label for="last-name">LAST NAME</label>
              <input type="text" id="last-name" name="last-name" required placeholder="Odinson">
            </div>
            <div class="field">
              <label for="email">EMAIL</label>
              <input type="email" id="email" name="email" required placeholder="thor@valhalla.com">
            </div>
            <div class="field">
              <label for="phone">PHONE NUMBER</label>
              <input type="tel" id="phone" name="phone" placeholder="012 345 6789">
            </div>
            <div class="field">
              <label for="password">PASSWORD</label>
              <input type="password" id="password" name="password" required minlength="6">
              <span class="error" id="password-error">* Passwords do not match</span>
            </div>
            <div class="field">
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input type="password" id="confirm-password" name="confirm-password" required minlength="6">
            </div>
          </div>
        </div>

        <button type="submit" class="create-btn">Create Account</button>
      </form>

      <p class="login-text">Already have an account? <a href="#">Log in</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
